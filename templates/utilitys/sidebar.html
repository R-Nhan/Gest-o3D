{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/utilitys/sidebar.css' %}">
</head>

<body>
    <aside class="sidebar">

        <div class="sidebar-header">
            <span class="sidebar-brand">Toys Store 3D</span>

            <button type="button" class="sidebar-toggle" aria-label="Recolher menu" aria-expanded="true" onclick="toggleSidebar()">
                <span aria-hidden="true">☰</span>
            </button>
        </div>

        <a href="{% url 'home' %}" class="sidebar-item{% if request.resolver_match.url_name == 'home' %} active{% endif %}">

            <span class="item-icon">
                ◴
            </span>

            <span class="sidebar-label">
                Painel de Controle
            </span>

        </a>

        <!-- Sessao 1 -->
        <div class="menu-section">

            <button type="button" class="section-title" onclick="toggleSection(this)">

                <span class="section-label">
                    Filamento
                </span>

                <span class="section-arrow">
                    ⌃
                </span>

            </button>


            <div class="section-items">

                <a href="{% url 'dashboard' %}" class="sidebar-item{% if request.resolver_match.url_name == 'dashboard' and request.path|slice:':9' == '/filamneto' %} active{% endif %}">

                    <span class="item-icon">
                        ▥
                    </span>

                    <span class="sidebar-label">
                        Dashboards
                    </span>

                </a>


                <a href="{% url 'fila' %}" class="sidebar-item{% if request.resolver_match.url_name == 'fila' and request.path|slice:':9' == '/filamneto' %} active{% endif %}">

                    <span class="item-icon">
                        ◎
                    </span>

                    <span class="sidebar-label">
                        Fila de Impressão
                    </span>

                </a>


                <a href="{% url 'vender' %}" class="sidebar-item{% if request.resolver_match.url_name == 'vender' and request.path|slice:':9' == '/filamneto' %} active{% endif %}">

                    <span class="item-icon">
                        R$
                    </span>

                    <span class="sidebar-label">
                        Vender
                    </span>

                </a>


                <a href="{% url 'concluido' %}" class="sidebar-item{% if request.resolver_match.url_name == 'concluido' and request.path|slice:':9' == '/filamneto' %} active{% endif %}">

                    <span class="item-icon">
                        ↻
                    </span>

                    <span class="sidebar-label">
                        Concluidos
                    </span>

                </a>

            </div>

        </div>

        <!-- Sessao 2 -->

        <div class="menu-section">

            <button type="button" class="section-title" onclick="toggleSection(this)">

                <span class="section-label">
                    Resina
                </span>

                <span class="section-arrow">
                    ⌃
                </span>

            </button>


            <div class="section-items">

                <a href="{% url 'resina:dashboard' %}" class="sidebar-item{% if request.resolver_match.url_name == 'dashboard' and request.path|slice:':7' == '/resina' %} active{% endif %}">

                    <span class="item-icon">
                        ▥
                    </span>

                    <span class="sidebar-label">
                        Dashboards
                    </span>

                </a>


                <a href="{% url 'resina:fila' %}" class="sidebar-item{% if request.resolver_match.url_name == 'fila' and request.path|slice:':7' == '/resina' %} active{% endif %}">

                    <span class="item-icon">
                        ◎
                    </span>

                    <span class="sidebar-label">
                        Fila de Impressão
                    </span>

                </a>


                <a href="{% url 'resina:vender' %}" class="sidebar-item{% if request.resolver_match.url_name == 'vender' and request.path|slice:':7' == '/resina' %} active{% endif %}">

                    <span class="item-icon">
                        R$
                    </span>

                    <span class="sidebar-label">
                        Vender
                    </span>

                </a>


                <a href="{% url 'resina:concluido' %}" class="sidebar-item{% if request.resolver_match.url_name == 'concluido' and request.path|slice:':7' == '/resina' %} active{% endif %}">

                    <span class="item-icon">
                        ↻
                    </span>

                    <span class="sidebar-label">
                        Concluidos
                    </span>

                </a>

            </div>

        </div>

        <!-- RODAPÉ -->

        <div class="sidebar-footer">

            <span class="sidebar-label">Desenvolvido por Rubens Ian - 2026</span>

        </div>

    </aside>
    <script>
        function toggleSidebar() {

            const sidebar = document.querySelector(".sidebar");
            const pageContent = document.querySelector(".page-content");
            const toggle = document.querySelector(".sidebar-toggle");
            const isCollapsed = sidebar.classList.toggle("collapsed");

            pageContent.classList.toggle("sidebar-collapsed", isCollapsed);
            toggle.setAttribute("aria-expanded", String(!isCollapsed));
            toggle.setAttribute("aria-label", isCollapsed ? "Expandir menu" : "Recolher menu");
            localStorage.setItem("sidebar-collapsed", String(isCollapsed));

        }

        window.addEventListener("DOMContentLoaded", function () {

            const sidebar = document.querySelector(".sidebar");
            const pageContent = document.querySelector(".page-content");
            const toggle = document.querySelector(".sidebar-toggle");
            const savedSidebarState = localStorage.getItem("sidebar-collapsed") === "true";

            if (savedSidebarState) {
                sidebar.classList.add("collapsed");
                pageContent.classList.add("sidebar-collapsed");
                toggle.setAttribute("aria-expanded", "false");
                toggle.setAttribute("aria-label", "Expandir menu");
            }

        });

        function toggleSection(button) {

            const section = button.closest(".menu-section");

            section.classList.toggle("collapsed");

        }

    </script>
</body>

</html>
