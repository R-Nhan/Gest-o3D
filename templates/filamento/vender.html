{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vender</title>
    <link rel="stylesheet" href="{% static 'css/filamento/vender.css' %}">
</head>

<body>
    {% include "utilitys/sidebar.html" %}
    <main class="page-content">
        {% block content %}
        <div class="calculadora-custos">

            <p class="calculadora-descricao">
                Calcule o custo da sua impressão 3D.
            </p>

            <!-- CAMPOS -->
            <div class="calculadora-campos">

                <div class="campo">
                    <label>Tempo (h)</label>
                    <input type="number" id="tempo" min="0" step="0.1" placeholder="10">
                </div>

                <div class="campo">
                    <label>Filamento (g)</label>
                    <input type="number" id="peso" min="0" step="0.1" placeholder="80">
                </div>

                <div class="campo">
                    <label>Extras (R$)</label>
                    <input type="number" id="extras" min="0" step="0.01" placeholder="5">
                </div>

                <div class="campo">
                    <label>Lucro (%)</label>
                    <input type="number" id="lucro" min="0" step="1" placeholder="50">
                </div>

            </div>


            <!-- RESULTADOS -->
            <div class="resultados">

                <div class="resultado">
                    <span>⚡ Energia</span>
                    <strong id="resultadoEnergia">R$ 0,00</strong>
                </div>

                <div class="resultado">
                    <span>🧵 Filamento</span>
                    <strong id="resultadoFilamento">R$ 0,00</strong>
                </div>

                <div class="resultado">
                    <span>📦 Extras</span>
                    <strong id="resultadoExtras">R$ 0,00</strong>
                </div>

                <div class="resultado">
                    <span>Custo total</span>
                    <strong id="resultadoTotal">R$ 0,00</strong>
                </div>

                <div class="resultado">
                    <span>💰 Lucro</span>
                    <strong id="resultadoLucro">R$ 0,00</strong>
                </div>

            </div>


            <!-- VALOR SUGERIDO -->
            <div class="valor-sugerido">

                <span>Valor sugerido de venda</span>

                <strong id="resultadoVenda">
                    R$ 0,00
                </strong>

            </div>

        </div>
        <script>

            const PRECO_KWH = 0.88;
            const POTENCIA_IMPRESSORA = 300; // Watts
            const PRECO_FILAMENTO_GRAMA = 120 / 1000; // R$ 0,15 por grama


            function dinheiro(valor) {
                return valor.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });
            }


            function calcularCustos() {

                const tempo =
                    parseFloat(document.getElementById("tempo").value) || 0;

                const peso =
                    parseFloat(document.getElementById("peso").value) || 0;

                const extras =
                    parseFloat(document.getElementById("extras").value) || 0;

                const lucroPercentual =
                    parseFloat(document.getElementById("lucro").value) || 0;


                // =========================
                // ENERGIA
                // =========================

                const potenciaKW = POTENCIA_IMPRESSORA / 1000;

                const consumoKWh = potenciaKW * tempo;

                const custoEnergia = consumoKWh * PRECO_KWH;


                // =========================
                // FILAMENTO
                // =========================

                const custoFilamento =
                    peso * PRECO_FILAMENTO_GRAMA;


                // =========================
                // CUSTO TOTAL
                // =========================

                const custoTotal =
                    custoEnergia +
                    custoFilamento +
                    extras;


                // =========================
                // LUCRO
                // =========================

                const valorLucro =
                    custoTotal * (lucroPercentual / 100);


                // =========================
                // VALOR DE VENDA
                // =========================

                const valorVenda =
                    custoTotal + valorLucro;


                // =========================
                // MOSTRAR RESULTADOS
                // =========================

                document.getElementById("resultadoEnergia").textContent =
                    dinheiro(custoEnergia);

                document.getElementById("resultadoFilamento").textContent =
                    dinheiro(custoFilamento);

                document.getElementById("resultadoExtras").textContent =
                    dinheiro(extras);

                document.getElementById("resultadoTotal").textContent =
                    dinheiro(custoTotal);

                document.getElementById("resultadoLucro").textContent =
                    dinheiro(valorLucro);

                document.getElementById("resultadoVenda").textContent =
                    dinheiro(valorVenda);
            }


            // Atualizar automaticamente

            document.getElementById("tempo")
                .addEventListener("input", calcularCustos);

            document.getElementById("peso")
                .addEventListener("input", calcularCustos);

            document.getElementById("extras")
                .addEventListener("input", calcularCustos);

            document.getElementById("lucro")
                .addEventListener("input", calcularCustos);

        </script>
        {% endblock %}
    </main>
</body>

</html>
